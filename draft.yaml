models:
  
  Role:
    name: string
    description: string nullable
    timestamps: true
    user_id: foreign
    relationships:
      hasMany: User

  User:
    name: string nullable
    email: string:unique
    password: string
    full_name: string nullable
    timestamps: true
    relationships:
      belongsTo: Role
      hasMany:
        - Invoice
        - StockMovement
        
  RoleUser:
    role_id: foreign
    user_id: foreign
    indexes:
      - unique: role_id, user_id

  Product:
    item_code: string:unique
    item_designation: string
    item_measurement_unit: string
    barcode: string nullable
    vat_rate: double
    timestamps: true
    user_id: foreign
    relationships:
      hasMany:
        - StockMovement
        - WarehouseProduct

  Warehouse:
    name: string
    location: string nullable
    timestamps: true
    user_id: foreign
    relationships:
      hasMany:
        - StockMovement
        - WarehouseProduct

  Customer:
    customer_name: string
    customer_TIN: string unique nullable
    customer_phone: string unique nullable
    customer_address: string nullable
    vat_customer_payer: string
    timestamps: true
    user_id: foreign
    relationships:
      hasMany: Invoice

  Invoice:
    invoice_number: string
    invoice_date: datetime
    invoice_type: string
    invoice_identifier: string
    invoice_currency: string

    # TAXPAYER (SELLER)
    tp_type: string
    tp_name: string
    tp_TIN: string
    tp_trade_number: string nullable
    tp_postal_number: string nullable
    tp_phone_number: string nullable

    tp_address_province: string nullable
    tp_address_commune: string nullable
    tp_address_quartier: string nullable
    tp_address_avenue: string nullable
    tp_address_rue: string nullable
    tp_address_number: string nullable

    tp_fiscal_center: string nullable
    tp_activity_sector: string nullable
    tp_legal_form: string nullable

    vat_taxpayer: string
    ct_taxpayer: string
    tl_taxpayer: string

    # CUSTOMER SNAPSHOT
    customer_name: string
    customer_TIN: string nullable
    customer_address: string nullable
    vat_customer_payer: string

    # TOTALS
    invoice_amount_nvat: decimal:15,2
    invoice_vat_amount: decimal:15,2
    invoice_total_amount: decimal:15,2

    # EBMS RESPONSE
    invoice_registered_number: string nullable
    invoice_registered_date: datetime nullable
    electronic_signature: text nullable

    obr_submission_status: enum:PENDING,SENT,ACCEPTED,REJECTED
    obr_response_message: text nullable

    customer_id: foreign
    created_by: foreign:users
    timestamps: true
    user_id: foreign

    relationships:
      belongsTo:
        - Customer
        - User:created_by
      hasMany:
        - InvoiceItem
        - StockMovement

  InvoiceItem:
    invoice_id: foreign
    item_designation: string
    item_quantity: double
    item_price: double
    item_ct: double nullable
    item_tl: double nullable
    item_ott_tax: double nullable
    item_tsce_tax: double nullable

    item_price_nvat: double
    vat: double
    item_price_wvat: double
    item_total_amount: double
    timestamps: false
    user_id: foreign
    relationships:
      belongsTo: Invoice

  StockMovement:
    system_or_device_id: string
    item_code: string
    item_designation: string
    item_quantity: double
    item_measurement_unit: string
    item_purchase_or_sale_price: double
    item_purchase_or_sale_currency: string
    item_movement_type: string
    item_movement_invoice_ref: string nullable
    item_movement_description: string nullable
    item_movement_date: datetime
    obr_submission_status: enum:PENDING,SENT,ACCEPTED,REJECTED
    obr_response_message: text nullable
    obr_sent_at: datetime nullable
    product_id: foreign
    warehouse_id: foreign
    created_by: foreign:users
    timestamps: true
    user_id: foreign

    relationships:
      belongsTo:
        - Product
        - Warehouse
        - User:created_by

  WarehouseProduct:
    product_id: foreign
    warehouse_id: foreign
    quantity: double
    unit_price: double
    currency: string
    last_stock_movement_id: foreign:stock_movements
    timestamps: true
    user_id: foreign
    indexes:
      - unique: product_id, warehouse_id
    relationships:
      belongsTo:
        - Product
        - Warehouse
        - StockMovement:last_stock_movement_id
